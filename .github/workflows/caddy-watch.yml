# Once a day: is there a new Caddy release? If so, open an issue (GitHub e-mails you).
# Stackmoor ships Caddy with each panel release (ghcr.io/<owner>/stackmoor-caddy:<version>),
# so a new Caddy reaches users with the next panel release – this issue is the reminder.
name: Caddy watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare with the newest Caddy release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)   # e.g. v2.11.4
          version=${latest#v}
          pinned=$(sed -n 's/^ARG CADDY_VERSION=//p' caddy/Dockerfile)              # e.g. 2.11
          title="Caddy ${latest} is out"
          if gh issue list --state all --search "\"${title}\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already reported: ${title}"; exit 0
          fi
          case "$version" in
            "$pinned".*)
              what="It is a patch of the ${pinned} line that caddy/Dockerfile already uses, so nothing needs to change in the code: **publish a panel release** (e.g. a patch version) and the new Caddy image is built with it."
              ;;
            *)
              what="It is a new line – caddy/Dockerfile uses \`CADDY_VERSION=${pinned}\`. **Change it to the new line**, test on edge, then publish a panel release."
              ;;
          esac
          body=$(printf '%s\n\n%s\n\nRelease notes: https://github.com/caddyserver/caddy/releases/tag/%s\n\nClose this issue once the panel release is out.' \
            "Caddy ${latest} was released." "$what" "$latest")
          gh issue create --title "$title" --body "$body"
          echo "Opened: ${title}"
