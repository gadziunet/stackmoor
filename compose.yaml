# Development setup (builds the image from source). For servers use install.sh.
# IMPORTANT: the stacks folder must be mounted at the SAME path inside the container
# as on the host, because the panel passes paths to the host's Docker daemon.
# Default: /opt/stacks. On a Mac set it in .env, e.g.: STACKS_DIR=/Users/<you>/stacks
services:
  moorline:
    build: .
    # Or use a published image instead of building:
    # image: ghcr.io/gadziunet/moorline:latest
    container_name: moorline
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - STACKS_DIR=${STACKS_DIR:-/opt/stacks}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACKS_DIR:-/opt/stacks}:${STACKS_DIR:-/opt/stacks}
      - ./data:/app/data
